name: Bug report
description: Something does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A security problem never goes in an issue: email security@matterwave.ai or use
        **Report a vulnerability** on the repository's Security tab.
        Never paste an API key, a token or a keychain entry.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit of the package or client (for example `matterwave-tui --version`).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: The operating system and version, and the editor, terminal, Python or Node version where it matters.
  - type: input
    id: request-id
    attributes:
      label: Request id
      description: The request id shown with the error (`X-Request-Id`), if there was one.
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Anything the client printed or logged around the failure, with credentials removed.
      render: text
